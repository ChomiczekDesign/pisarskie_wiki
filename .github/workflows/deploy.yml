name: Build and deploy wiki

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install and verify Kiln v0.9.5
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/otaleghani/kiln/releases/download/v0.9.5/kiln_linux_amd64 \
            --output kiln
          curl --fail --location --silent --show-error \
            https://github.com/otaleghani/kiln/releases/download/v0.9.5/checksums.txt \
            --output checksums.txt
          grep ' kiln_linux_amd64$' checksums.txt | sha256sum --check --strict
          chmod +x kiln
          ./kiln version

      - name: Check Markdown vault
        run: ./kiln doctor --input ./wiki

      - name: Build site
        run: ./kiln generate

      - name: Verify generated site
        shell: bash
        run: |
          test -f ./public/index.html
          grep --fixed-strings --quiet 'Pisarskie wiki' ./public/index.html

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
